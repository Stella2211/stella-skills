name: Skill usage hooks
on:
  push:
    branches: [main, 'codex/selective-skill-compaction-hooks']
    paths:
      - 'plugins/docs-writer/**'
      - 'plugins/long-task-execution/**'
      - 'tests/test_skill_usage.py'
      - 'docs/skill-usage-hooks.md'
      - '.github/workflows/skill-usage-hooks.yml'
  pull_request:
    paths:
      - 'plugins/docs-writer/**'
      - 'plugins/long-task-execution/**'
      - 'tests/test_skill_usage.py'
      - 'docs/skill-usage-hooks.md'
      - '.github/workflows/skill-usage-hooks.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Test standalone helpers and real hook command
        run: uv run --offline --no-project python -m unittest discover -s tests -p test_skill_usage.py -v
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Lint changed skill documentation
        run: bun plugins/docs-writer/skills/docs-writer/scripts/lint-docs.ts plugins/docs-writer/skills/docs-writer/SKILL.md plugins/long-task-execution/skills/long-task-execution/SKILL.md docs/skill-usage-hooks.md
